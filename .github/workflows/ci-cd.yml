name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  backend-build-aarch64:
    name: Build Backend (Aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3 python3-pip
          pip3 install kconfiglib

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DTOOLCHAIN_PREFIX=aarch64-linux-gnu- ..
        working-directory: backend

      - name: Build backend
        run: cmake --build build -j$(nproc)
        working-directory: backend

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-bin-aarch64
          path: backend/build/MonitorSystem
          retention-days: 7
